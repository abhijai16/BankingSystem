plugins {
    id 'application'
}

group = 'com.abhijai.banking'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.abhijai.banking.app.BankingApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('run') {
    standardInput = System.in
}

test {
    useJUnitPlatform()
}

def runtimeLibraries = configurations.runtimeClasspath
tasks.named('jar') {
    archiveFileName = 'BankingSystem.jar'
    inputs.files(runtimeLibraries)
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    doFirst {
        manifest.attributes 'Class-Path': runtimeLibraries.files.collect { "lib/${it.name}" }.sort().join(' ')
    }
}

// The same directory layout as the ready-to-run copy in the download.
tasks.register('portable', Sync) {
    into layout.buildDirectory.dir('portable')
    from tasks.named('jar')
    into('lib') {
        from runtimeLibraries
    }
}
